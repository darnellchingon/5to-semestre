<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mi página web</title>
</head>
<body>

<h1>Formulario de registro</h1>

<form>
	<p>
		<label for="usuario">Nombre de usuario:</label>
		<input type="text" id="usuario" name="usuario" minlength="5" maxlength="15" required>
	</p>

	<p>
		<label for="correo">Correo electrónico:</label>
		<input type="email" id="correo" name="correo">
	</p>

	<p>
		<label for="telefono">Teléfono (solo números):</label>
		<input type="text" id="telefono" name="telefono" pattern="[0-9]+">
	</p>

	<p>
		<label for="id-usuario">ID de usuario:</label>
		<input type="text" id="id-usuario" name="id-usuario" value="Se asignará después" disabled>
	</p>

	<button type="submit">Registrarme</button>
</form>

<a href="../index.html">Volver a la página principal</a>        




</body>
</html>
