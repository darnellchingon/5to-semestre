git<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora | Bufete de Abogados Irán el Ineficiente</title>
    <link rel="stylesheet" href="../assets/abogados.css">
    <script src="../assets/calculadora.js" defer></script>
</head>
<body>
    <main class="calculadora-pagina">
        <div class="calculadora" aria-label="Calculadora">
            <output class="calculadora-pantalla" id="pantalla" aria-live="polite" aria-atomic="true">0</output>
            <div class="calculadora-teclas">
                <button class="tecla tecla-accion" type="button" data-action="clear" aria-label="Borrar todo">C</button>
                <button class="tecla tecla-operador" type="button" data-operator="/" aria-label="Dividir">÷</button>
                <button class="tecla tecla-operador" type="button" data-operator="*" aria-label="Multiplicar">×</button>
                <button class="tecla tecla-operador" type="button" data-operator="-" aria-label="Restar">−</button>
                <button class="tecla" type="button" data-digit="7">7</button>
                <button class="tecla" type="button" data-digit="8">8</button>
                <button class="tecla" type="button" data-digit="9">9</button>
                <button class="tecla tecla-operador" type="button" data-operator="+" aria-label="Sumar">+</button>
                <button class="tecla" type="button" data-digit="4">4</button>
                <button class="tecla" type="button" data-digit="5">5</button>
                <button class="tecla" type="button" data-digit="6">6</button>
                <button class="tecla tecla-igual" type="button" data-action="equals" aria-label="Resultado">=</button>
                <button class="tecla" type="button" data-digit="1">1</button>
                <button class="tecla" type="button" data-digit="2">2</button>
                <button class="tecla" type="button" data-digit="3">3</button>
                <button class="tecla tecla-cero" type="button" data-digit="0">0</button>
                <button class="tecla" type="button" data-action="decimal" aria-label="Punto decimal">.</button>
            </div>
        </div>
    </main>
</body>
</html>
